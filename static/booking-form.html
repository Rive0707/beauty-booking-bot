<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>お客様情報入力</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --paper:#FBF6F0;
    --paper-line:#EAE1D6;
    --ink:#3B322C;
    --ink-soft:#8A7F74;
    --plum:#A8556B;
    --plum-soft:#F1DEE3;
    --error:#B3413B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:100px;
  }
  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--paper-line);
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:20px;
    margin:0 0 3px;
  }
  .sub{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .steps{ padding:14px 20px 0; font-size:11px; color:var(--ink-soft); }
  .steps .cur{ color:var(--plum); font-weight:700; }

  .summary{
    margin:16px 20px 0;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:14px;
    padding:14px 16px;
    font-size:13px;
  }
  .summary .menu{ font-family:'Shippori Mincho', serif; font-weight:700; font-size:15px; margin:0 0 4px; }
  .summary .dt{ color:var(--ink-soft); }

  form{ padding:20px; }
  .field{ margin-bottom:18px; }
  label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .req-badge{
    color: var(--plum);
    font-weight: 700;
    margin-left: 4px;
  }
  .opt-badge{
    color: var(--ink-soft);
    font-size: 11px;
    margin-left: 4px;
  }
  input[type="text"], input[type="tel"], select{
    width:100%;
    border:1px solid var(--paper-line);
    background:#fff;
    border-radius:10px;
    padding:12px 13px;
    font-size:15px;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--plum);
  }
  .hint{ font-size:11px; color:var(--ink-soft); margin-top:5px; }
  .radio-row{ display:flex; gap:16px; padding:4px 0; flex-wrap:wrap; }
  .radio-row label{
    display:flex; align-items:center; gap:6px;
    font-size:13.5px; color:var(--ink);
    margin:0;
  }
  .birth-row{ display:flex; gap:8px; }
  .birth-row select{ flex:1; }
  .err-text{
    display:none;
    color:var(--error);
    font-size:11.5px;
    margin-top:5px;
  }
  .field.invalid input, .field.invalid select{ border-color:var(--error); }
  .field.invalid .err-text{ display:block; }

  .status-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--paper);
    border-top:1px solid var(--paper-line);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  }
  .submit-btn{
    all:unset;
    display:block;
    width:100%;
    text-align:center;
    background:var(--plum);
    color:#fff;
    padding:13px;
    border-radius:10px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .submit-btn[disabled]{ opacity:.55; }
  .submit-note{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  .toast{
    position:fixed;
    left:20px; right:20px; top:16px;
    background:var(--error);
    color:#fff;
    padding:12px 16px;
    border-radius:10px;
    font-size:13px;
    display:none;
    z-index:20;
  }
  .toast.show{ display:block; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <div style="margin-bottom: 8px;">
    <button onclick="history.back()" style="all:unset; font-size:12.5px; color:var(--plum); font-weight:700; cursor:pointer;">‹ 日時選択へ戻る</button>
  </div>
  <h1>お客様情報のご入力</h1>
  <p class="sub">Please enter your booking details / お客様情報をご入力ください</p>
</header>

<div class="steps">✓ メニュー ・ ✓ 日時 ・ <span class="cur">③ お客様情報</span></div>

<div class="summary" id="summary"></div>

<p class="hint" id="prefillNotice" style="display:none; margin:10px 20px 0; padding:10px 12px; background:#fff; border:1px solid var(--paper-line); border-radius:10px;">
  前回のご登録情報を自動で入力しました。
</p>

<form id="bookingForm">

  <!-- 氏名（必須） -->
  <div class="field">
    <label for="name">お名前 / Full Name<span class="req-badge">※必須</span></label>
    <input type="text" id="name" placeholder="Taro Yamada " autocomplete="name">
    <p class="hint">フルネームでご入力ください</p>
    <p class="err-text">お名前をご入力ください</p>
  </div>

  <!-- フリガナ（任意・自動補完） -->
  <div class="field">
    <label for="furigana">フリガナ / Reading<span class="opt-badge">（任意）</span></label>
    <input type="text" id="furigana" placeholder="自動入力されます / Auto-filled" autocomplete="off">
    <p class="hint">未入力の場合はお名前がそのまま使用されます</p>
  </div>

  <!-- 性別（任意） -->
  <div class="field">
    <label>性別 / Gender<span class="opt-badge">（任意）</span></label>
    <div class="radio-row">
      <label><input type="radio" name="gender" value="女性"> 女性 (Female)</label>
      <label><input type="radio" name="gender" value="男性"> 男性 (Male)</label>
      <label><input type="radio" name="gender" value="回答しない"> なし (Other)</label>
    </div>
  </div>

  <!-- 生年月日（任意） -->
  <div class="field">
    <label>誕生日 / Date of Birth<span class="opt-badge">（任意）</span></label>
    <div class="birth-row">
      <select id="birthYear"><option value="">年(Year)</option></select>
      <select id="birthMonth"><option value="">月(Month)</option></select>
      <select id="birthDay"><option value="">日(Day)</option></select>
    </div>
  </div>

  <!-- 電話番号（必須） -->
  <div class="field">
    <label for="phone">電話番号 / Phone Number<span class="req-badge">※必須</span></label>
    <input type="tel" id="phone" placeholder="09012345678" autocomplete="tel" inputmode="numeric">
    <p class="err-text">電話番号をご入力ください</p>
  </div>
</form>

<div class="status-bar">
  <button class="submit-btn" id="submitBtn">この内容で予約を確定する</button>
  <p class="submit-note">確定後、LINEに予約完了のご連絡をお送りします</p>
</div>

<script>
function escapeHtml(str){
  if(!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
  
const LIFF_ID = '2011089217-uEvBgkD3'; // 本番用LIFF ID
const API_BASE = window.location.origin;
const params = new URLSearchParams(location.search);
const bookingInfo = {
  menu_ids: params.get('menu_ids') || params.get('menu_id'),
  menu_name: params.get('menu_name'),
  date: params.get('date'),
  time: params.get('time'),
  day: params.get('day'),
  weekday: params.get('weekday'),
  shop_name: params.get('shop_name') || 'URU SALON'
};

document.getElementById('summary').innerHTML = `
  <p class="menu">${bookingInfo.menu_name || 'メニュー未選択'}</p>
  <p class="dt">${bookingInfo.date || ''}（${bookingInfo.weekday || ''}）${bookingInfo.time || ''}〜</p>
  <p class="dt" style="margin-top:4px;">📍 ${escapeHtml(bookingInfo.shop_name)}</p>
`;

// 誕生日プルダウンの初期化
const yearSel = document.getElementById('birthYear');
const monthSel = document.getElementById('birthMonth');
const daySel = document.getElementById('birthDay');
const thisYear = new Date().getFullYear();
for(let y = thisYear; y >= thisYear - 90; y--){
  yearSel.innerHTML += `<option value="${y}">${y}年</option>`;
}
for(let m = 1; m <= 12; m++){
  monthSel.innerHTML += `<option value="${m}">${m}月</option>`;
}
for(let d = 1; d <= 31; d++){
  daySel.innerHTML += `<option value="${d}">${d}日</option>`;
}

// 氏名入力時にフリガナ欄へ自動コピー・簡易カタカナ変換
document.getElementById('name').addEventListener('input', (e) => {
  const furiganaInput = document.getElementById('furigana');
  if (!furiganaInput.dataset.manuallyEdited) {
    let val = e.target.value.trim();
    // ひらがなをカタカナに変換
    val = val.replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
    furiganaInput.value = val.toUpperCase();
  }
});

document.getElementById('furigana').addEventListener('input', () => {
  document.getElementById('furigana').dataset.manuallyEdited = "true";
});

let liffUserId = null;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 3200);
}

function validate(){
  let ok = true;
  const nameField = document.getElementById('name').closest('.field');
  const phoneField = document.getElementById('phone').closest('.field');

  nameField.classList.toggle('invalid', !document.getElementById('name').value.trim());
  phoneField.classList.toggle('invalid', !document.getElementById('phone').value.trim());

  if(nameField.classList.contains('invalid')) ok = false;
  if(phoneField.classList.contains('invalid')) ok = false;

  return ok;
}

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  if(!bookingInfo.menu_ids || !bookingInfo.date || !bookingInfo.time){
    showToast('メニューまたは日時が選択されていません。前の画面からやり直してください。');
    return;
  }
  if(!validate()){
    showToast('必須項目（お名前・電話番号）をご入力ください');
    return;
  }
  if(!liffUserId){
    showToast('LINEアカウントの確認ができませんでした。LINEアプリ内でお試しください。');
    return;
  }

  const nameVal = document.getElementById('name').value.trim();
  const furiganaVal = document.getElementById('furigana').value.trim() || nameVal;

  const gender = document.querySelector('input[name="gender"]:checked');
  
  let birthdate = null;
  if (yearSel.value && monthSel.value && daySel.value) {
    birthdate = `${yearSel.value}-${String(monthSel.value).padStart(2,'0')}-${String(daySel.value).padStart(2,'0')}`;
  }

  const menuIdsArray = bookingInfo.menu_ids.split(',').map(id => parseInt(id, 10));

  const payload = {
    user_id: liffUserId,
    shop_name: bookingInfo.shop_name,
    menu_ids: menuIdsArray,
    booking_date: bookingInfo.date,
    booking_time: bookingInfo.time,
    name: nameVal,
    furigana: furiganaVal,
    gender: gender ? gender.value : null,
    birthdate: birthdate,
    phone: document.getElementById('phone').value.trim()
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '予約を確定しています…';

  try {
      const res = await fetch(`${API_BASE}/api/booking/create`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('failed');
  
      // 予約成功時：画面を完了UIに差し替え
// 予約成功時：画面を完了UIに切り替えて1秒後に自動で閉じる
      btn.textContent = '予約が完了しました';
      document.body.innerHTML = `
        <div style="padding: 50px 20px; text-align: center;">
          <div style="font-size: 48px; margin-bottom: 12px;">🎉</div>
          <h2 style="font-family:'Shippori Mincho', serif; font-size: 22px; color: var(--ink); margin-bottom: 8px;">ご予約が完了しました</h2>
          <p style="font-size: 13px; color: var(--ink-soft); margin-bottom: 24px;">LINEに予約完了メッセージをお送りしました。<br>画面を自動で閉じます…</p>
          
          <div style="background: #fff; border: 1px solid var(--paper-line); border-radius: 14px; padding: 16px; text-align: left; margin-bottom: 24px;">
            <p style="font-size: 11px; color: var(--ink-soft); margin: 0 0 4px;">ご予約内容</p>
            <p style="font-family:'Shippori Mincho', serif; font-weight: 700; font-size: 16px; margin: 0 0 6px;">${escapeHtml(bookingInfo.menu_name || '')}</p>
            <p style="font-size: 13.5px; color: var(--plum); font-weight: 700; margin: 0;">${bookingInfo.date}（${bookingInfo.weekday}）${bookingInfo.time}〜</p>
          </div>
          
          <button onclick="if(window.liff && liff.isInClient && liff.isInClient()){ liff.closeWindow(); }" style="all:unset; background: var(--plum); color: #fff; width: 100%; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14.5px; cursor: pointer;">
            画面を今すぐ閉じる
          </button>
        </div>
      `;

      // 1秒後に自動でLINE画面を閉じる
      setTimeout(() => {
        if (window.liff && liff.isInClient && liff.isInClient()) {
          liff.closeWindow();
        }
      }, 2000);
  
    } catch(e) {
      showToast('予約の確定に失敗しました。時間をおいて再度お試しください。');
      btn.disabled = false;
      btn.textContent = 'この内容で予約を確定する';
    }
});
(async function init(){
  try{
    if(window.liff){
      await liff.init({ liffId: LIFF_ID });
      if(liff.isLoggedIn()){
        const profile = await liff.getProfile();
        liffUserId = profile.userId;

        try{
          const res = await fetch(`${API_BASE}/api/customers/${encodeURIComponent(liffUserId)}`);
          if(res.ok){
            const c = await res.json();
            let filled = false;

            if(c.name){ document.getElementById('name').value = c.name; filled = true; }
            if(c.furigana){ document.getElementById('furigana').value = c.furigana; filled = true; }
            if(c.gender){
              const radio = document.querySelector(`input[name="gender"][value="${c.gender}"]`);
              if(radio){ radio.checked = true; filled = true; }
            }
            if(c.birthdate){
              const parts = c.birthdate.split('-');
              if(parts.length === 3){
                yearSel.value = parts[0];
                monthSel.value = String(parseInt(parts[1], 10));
                daySel.value = String(parseInt(parts[2], 10));
                filled = true;
              }
            }
            if(c.phone){ document.getElementById('phone').value = c.phone; filled = true; }

            if(filled){
              document.getElementById('prefillNotice').style.display = 'block';
            }
          }
        }catch(e){}
      }
    }
  }catch(e){
    console.error('LIFF init failed', e);
  }
})();
</script>

</body>
</html>
