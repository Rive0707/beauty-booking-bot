<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>メニューを選択</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --paper:#FBF6F0;
    --paper-line:#EAE1D6;
    --ink:#3B322C;
    --ink-soft:#8A7F74;
    --plum:#A8556B;
    --plum-soft:#F1DEE3;
    --radius-brush: 42% 58% 61% 39% / 48% 41% 59% 52%;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:24px;
  }
  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--paper-line);
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:20px;
    margin:0 0 3px;
    letter-spacing:.02em;
  }
  .sub{ font-size:12.5px; color:var(--ink-soft); margin:0; }

  .steps{
    display:flex;
    gap:6px;
    padding:14px 20px 0;
    font-size:11px;
    color:var(--ink-soft);
  }
  .steps .cur{ color:var(--plum); font-weight:700; }

  .list{ padding:16px 20px 0; }
  .menu-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
  }
  .menu-name{
    font-family:'Shippori Mincho', serif;
    font-size:16px;
    font-weight:700;
    margin:0 0 5px;
  }
  .menu-meta{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    gap:10px;
  }
  .select-btn{
    all:unset;
    flex-shrink:0;
    background:var(--plum);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .select-btn:active{ background:#8f4359; }

  .loading, .error, .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }
  .brush{
    width:16px; height:16px;
    border:1.6px solid var(--plum);
    border-radius:var(--radius-brush);
    display:inline-block;
    margin-bottom:10px;
  }
  .menu-card { cursor: pointer; }
  .menu-checkbox { width: 22px; height: 22px; accent-color: var(--plum); cursor: pointer; }
  .footer-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-top: 1px solid var(--paper-line);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between;
    z-index: 10;
  }
  .next-btn {
    all: unset; background: var(--plum); color: #fff;
    padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 14px;
    cursor: pointer;
  }
  .next-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  
</style>
</head>
<body>

<header>
  <h1>メニューを選択</h1>
  <p class="sub">ご希望の施術内容をお選びください</p>
</header>

<div class="steps"><span class="cur">① メニュー</span> ・ ② 日時 ・ ③ お客様情報</div>

<div class="list" id="list">
  <div class="loading">読み込み中…</div>
</div>

<script>
const LIFF_ID = '2011089217-uEvBgkD3'; // 本番用LIFF ID
const API_BASE = window.location.origin;

async function loadMenus(){
  const list = document.getElementById('list');
  try{
    const res = await fetch(`${API_BASE}/api/menus`);
    if(!res.ok) throw new Error('failed');
    const data = await res.json();
    render(data.menus);
  }catch(e){
    list.innerHTML = '<div class="error">メニューを取得できませんでした。<br>時間をおいて再度お試しください。</div>';
  }
}

const selectedMenus = new Map();

function render(menus){
  const list = document.getElementById('list');
  if(!menus.length){
    list.innerHTML = '<div class="empty"><span class="brush"></span><br>現在ご案内できるメニューがありません</div>';
    return;
  }
  list.innerHTML = menus.map(m => `
    <label class="menu-card">
      <input type="checkbox" class="menu-checkbox" data-id="${m.id}" data-name="${escapeHtml(m.name)}" data-price="${m.price}" onchange="toggleMenu(this)">
      <div style="flex:1;">
        <p class="menu-name">${escapeHtml(m.name)}</p>
        <div class="menu-meta">
          <span>¥${m.price.toLocaleString()}</span>
        </div>
      </div>
    </label>
  `).join('');
}

function toggleMenu(el){
  const id = el.dataset.id;
  if(el.checked){
    selectedMenus.set(id, {
      id: id,
      name: el.dataset.name,
      price: parseInt(el.dataset.price, 10)
    });
  }else{
    selectedMenus.delete(id);
  }
  updateFooter();
}

function updateFooter(){
  let totalPrice = 0;
  selectedMenus.forEach(m => totalPrice += m.price);

  document.getElementById('totalPrice').textContent = `¥${totalPrice.toLocaleString()}`;
  document.getElementById('nextBtn').disabled = selectedMenus.size === 0;
}

function goToCalendar(){
  if(selectedMenus.size === 0) return;
  const menuIds = Array.from(selectedMenus.keys()).join(',');
  const menuNames = Array.from(selectedMenus.values()).map(m => m.name).join(' + ');

  const params = new URLSearchParams({
    menu_ids: menuIds,
    menu_name: menuNames
  });
  window.location.href = `calendar.html?${params.toString()}`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

(async function init(){
  try{
    if(window.liff){
      await liff.init({ liffId: LIFF_ID });
    }
  }catch(e){ /* LIFF外での動作テストも許容する */ }
  loadMenus();
})();
</script>
<div class="footer-bar">
  <div>
    <div style="font-size:11px; color:var(--ink-soft);">選択中メニュー合計</div>
    <div style="font-size:15px; font-weight:700;"><span id="totalPrice">¥0</span></div>
  </div>
  <button class="next-btn" id="nextBtn" disabled onclick="goToCalendar()">日時選択へ進む ›</button>
</div>
</body>
</html>
