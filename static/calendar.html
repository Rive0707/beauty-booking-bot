<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ご予約日時の選択</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --paper:#FBF6F0;
    --paper-line:#EAE1D6;
    --ink:#3B322C;
    --ink-soft:#8A7F74;
    --plum:#A8556B;
    --plum-soft:#F1DEE3;
    --closed:#D8CFC4;
    --booked:#C9BFB4;
    --radius-brush: 42% 58% 61% 39% / 48% 41% 59% 52%;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:100px;
  }
  header{
    padding:20px 20px 14px;
    border-bottom:1px solid var(--paper-line);
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:20px;
    margin:0 0 2px;
    letter-spacing:.02em;
  }
  .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
  }
  .month-nav button{
    background:none;
    border:1px solid var(--paper-line);
    border-radius:999px;
    width:32px;
    height:32px;
    font-size:15px;
    color:var(--plum);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .month-label{
    font-family:'Shippori Mincho', serif;
    font-size:15px;
    font-weight:500;
  }

  .steps{
    padding:14px 20px 0;
    font-size:11px;
    color:var(--ink-soft);
  }
  .steps .cur{ color:var(--plum); font-weight:700; }

  /* --- 日付タブ --- */
  .date-strip{
    display:flex;
    gap:8px;
    padding:16px 20px 4px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .date-card{
    all:unset;
    flex-shrink:0;
    width:54px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:10px 0 9px;
    border:1.4px solid var(--paper-line);
    border-radius:14px;
    background:#fff;
    cursor:pointer;
  }
  .date-card .wd{
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .date-card .wd.sat{ color:#6E8FA3; }
  .date-card .wd.sun{ color:#B36B5E; }
  .date-card .num{
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .date-card .dot{
    width:5px; height:5px;
    border-radius:50%;
    background:var(--plum);
  }
  .date-card .dot.none{ background:transparent; }
  .date-card.selected{
    background:var(--plum);
    border-color:var(--plum);
  }
  .date-card.selected .wd,
  .date-card.selected .num{ color:#fff; }
  .date-card.selected .dot{ background:#fff; }
  .date-card.full{ opacity:.4; }

  /* --- 時間リスト --- */
  .time-section{
    padding:18px 20px 0;
  }
  .time-section-label{
    font-family:'Shippori Mincho', serif;
    font-size:15px;
    font-weight:700;
    margin:0 0 12px;
  }
  .time-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .time-slot-btn{
    all:unset;
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    border:1.4px solid var(--paper-line);
    border-radius:12px;
    background:#fff;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
  }
  .time-slot-btn .mark{
    width:16px;
    height:16px;
    border-radius:var(--radius-brush);
    border:1.8px solid var(--plum);
    flex-shrink:0;
  }
  .time-slot-btn.selected{
    background:var(--plum-soft);
    border-color:var(--plum);
  }
  .time-slot-btn.selected .mark{
    background:var(--plum);
  }
  .time-slot-btn:active{
    background:var(--plum-soft);
  }

  .empty-day{
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }

  .status-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--paper);
    border-top:1px solid var(--paper-line);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    display:none;
  }
  .status-bar.show{display:block;}
  .status-bar .chosen{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .status-bar .chosen b{color:var(--ink); font-weight:700;}
  .confirm-btn{
    all:unset;
    display:block;
    width:100%;
    text-align:center;
    background:var(--plum);
    color:#fff;
    padding:13px;
    border-radius:10px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
  }
  .loading, .error{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }
  
  /* 予約不可（✕）スロットのスタイル */
  .time-slot-btn.disabled {
    opacity: 0.45;
    background: #f2f2f7;
    cursor: not-allowed;
    border-color: var(--paper-line);
  }
  .time-slot-btn.disabled .mark {
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <h1>ご来店日時を選択</h1>
  <p class="sub" id="menuLabel">カレンダーからご希望の日時をお選びください</p>
  <div class="month-nav">
    <span class="month-label" id="monthLabel"></span>
    <label class="jump-btn" for="jumpDate">📅 日付を選ぶ</label>
    <input type="date" id="jumpDate" style="position:absolute; opacity:0; width:0; height:0;">
  </div>
</header>

<div class="steps" id="stepsBar"></div>

<div id="content">
  <div class="loading">読み込み中…</div>
</div>

<div class="status-bar" id="statusBar">
  <div class="chosen" id="chosenText"></div>
  <button class="confirm-btn" id="confirmBtn">この日時で予約に進む</button>
</div>

<script>
const LIFF_ID = '2011089217-uEvBgkD3'; // 本番用LIFF ID
const API_BASE = window.location.origin;
const INITIAL_DAYS = 14;
const LOAD_MORE_DAYS = 14;
let daysLoaded = INITIAL_DAYS;
let rangeStart = new Date();
rangeStart.setHours(0,0,0,0);
let selected = null;
let currentData = null;
let selectedDate = null;

const urlParams = new URLSearchParams(location.search);
const menuIds = urlParams.get('menu_ids') || urlParams.get('menu_id');
const menuName = urlParams.get('menu_name');
const menuDuration = urlParams.get('duration'); // メニューの所要時間（分）
const modifyBookingId = urlParams.get('modify_booking_id'); // 予約変更モードかどうか
let liffUserId = null;

if(modifyBookingId){
  document.getElementById('stepsBar').innerHTML = `📝 予約変更 － 新しい日時をお選びください`;
  if(menuName){
    document.getElementById('menuLabel').textContent = `「${menuName}」の新しいご希望日時をお選びください`;
  }
  document.getElementById('confirmBtn').textContent = 'この日時に変更する';
}else{
  document.getElementById('stepsBar').innerHTML =
    `✓ メニュー ・ <span class="cur">② 日時</span> ・ ③ お客様情報`;
  if(menuName){
    document.getElementById('menuLabel').textContent = `「${menuName}」のご希望日時をお選びください`;
  }
}

function toDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function availableSlotsFor(dateStr){
  const dayAvailability = currentData.availability[dateStr] || {};
  return currentData.time_slots.filter(slot => dayAvailability[slot] === 'available');
}

async function loadAvailability(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">読み込み中…</div>';
  try{
    const durationParam = menuDuration ? `&duration_minutes=${menuDuration}` : '';
    const excludeParam = modifyBookingId ? `&exclude_booking_id=${modifyBookingId}` : '';
    const res = await fetch(`${API_BASE}/api/availability?start_date=${toDateStr(rangeStart)}&days=${daysLoaded}${durationParam}${excludeParam}`);
    if(!res.ok) throw new Error('failed');
    currentData = await res.json();
    render();
  }catch(e){
    content.innerHTML = '<div class="error">空き状況を取得できませんでした。<br>時間をおいて再度お試しください。</div>';
  }
}

function render(){
  const { dates } = currentData;

  const firstDate = new Date(dates[0].date + 'T00:00:00');
  const lastDate = new Date(dates[dates.length-1].date + 'T00:00:00');
  
  const fY = firstDate.getFullYear();
  const fM = String(firstDate.getMonth() + 1).padStart(2, '0');
  const fD = String(firstDate.getDate()).padStart(2, '0');
  
  const lY = lastDate.getFullYear();
  const lM = String(lastDate.getMonth() + 1).padStart(2, '0');
  const lD = String(lastDate.getDate()).padStart(2, '0');

  if (fY === lY && fM === lM) {
    document.getElementById('monthLabel').textContent = `${fY}年${fM}月 ${fD}日〜${lD}日`;
  } else if (fY === lY) {
    document.getElementById('monthLabel').textContent = `${fY}年${fM}月${fD}日〜${lM}月${lD}日`;
  } else {
    document.getElementById('monthLabel').textContent = `${fY}年${fM}月${fD}日〜${lY}年${lM}月${lD}日`;
  }

  // 選択中の日付判定
  const stillInRange = dates.some(d => d.date === selectedDate);
  if(!stillInRange){
    const firstAvailable = dates.find(d => (currentData.availability[d.date] && Object.values(currentData.availability[d.date]).includes('available')));
    selectedDate = firstAvailable ? firstAvailable.date : dates[0].date;
  }
  selected = null;
  document.getElementById('statusBar').classList.remove('show');

  renderDateStrip();
  renderTimeList();
}

function renderDateStrip(){
  const { dates } = currentData;
  let html = '<div class="date-strip" id="dateStrip">';
  dates.forEach(d => {
    const wd = d.weekday;
    const cls = wd === '土' ? 'sat' : (wd === '日' ? 'sun' : '');
    const hasSlots = availableSlotsFor(d.date).length > 0;
    const isSelected = d.date === selectedDate;
    html += `<button class="date-card ${isSelected ? 'selected' : ''} ${hasSlots ? '' : 'full'}" data-date="${d.date}">
        <span class="wd ${cls}">${wd}</span>
        <span class="num">${d.day}</span>
        <span class="dot ${hasSlots ? '' : 'none'}"></span>
      </button>`;
  });
  html += '</div>';

  // 1. 先に画面へHTMLを書き出す
  document.getElementById('content').innerHTML = html + '<div class="time-section"><p class="time-section-label" id="timeSectionLabel"></p><div class="time-list" id="timeList"></div></div>';

  // 2. 画面に描画された「後」に要素を取得してイベントを付与する
  const stripEl = document.getElementById('dateStrip');
  if (stripEl) {
    stripEl.addEventListener('scroll', ()=>{
      if(stripEl.scrollLeft + stripEl.clientWidth >= stripEl.scrollWidth - 80){
        loadMoreDays();
      }
    });
  }

  // 3. 日付ボタンのクリックイベントを設定
  document.querySelectorAll('.date-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedDate = btn.dataset.date;
      selected = null;
      document.getElementById('statusBar').classList.remove('show');
      document.querySelectorAll('.date-card').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      renderTimeList();
    });
  });
}

// 追加読み込み処理（関数の外に配置）
let isLoadingMore = false;
async function loadMoreDays(){
  if(isLoadingMore) return;
  isLoadingMore = true;
  daysLoaded += LOAD_MORE_DAYS;
  const durationParam = menuDuration ? `&duration_minutes=${menuDuration}` : '';
  const excludeParam = modifyBookingId ? `&exclude_booking_id=${modifyBookingId}` : '';
  try {
    const res = await fetch(`${API_BASE}/api/availability?start_date=${toDateStr(rangeStart)}&days=${daysLoaded}${durationParam}${excludeParam}`);
    if(res.ok){
      const stripEl = document.getElementById('dateStrip');
      const savedScroll = stripEl ? stripEl.scrollLeft : 0;
      currentData = await res.json();
      renderDateStrip();
      const newStripEl = document.getElementById('dateStrip');
      if(newStripEl) newStripEl.scrollLeft = savedScroll;
    }
  } catch(e) {}
  isLoadingMore = false;
}

function renderTimeList(){
  const dateInfo = currentData.dates.find(d => d.date === selectedDate);
  const label = dateInfo ? `${dateInfo.day}日（${dateInfo.weekday}）の時間帯` : '';
  document.getElementById('timeSectionLabel').textContent = label;

  const dayAvailability = currentData.availability[selectedDate] || {};
  const listEl = document.getElementById('timeList');

  listEl.innerHTML = currentData.time_slots.map(slot => {
    const status = dayAvailability[slot];
    const isAvailable = status === 'available';

    if (isAvailable) {
      return `
        <button class="time-slot-btn" data-time="${slot}">
          <span class="mark"></span>${slot}
        </button>
      `;
    } else {
      return `
        <button class="time-slot-btn disabled" disabled>
          <span class="mark">✕</span>${slot} <span style="font-size:12px; margin-left:auto; color:var(--ink-soft);">受付不可</span>
        </button>
      `;
    }
  }).join('');

  document.querySelectorAll('.time-slot-btn:not(.disabled)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.time-slot-btn.selected').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      const dInfo = currentData.dates.find(d => d.date === selectedDate);
      selected = {
        date: selectedDate,
        time: btn.dataset.time,
        day: dInfo.day,
        weekday: dInfo.weekday
      };
      showStatusBar();
    });
  });
}

function showStatusBar(){
  const bar = document.getElementById('statusBar');
  const text = document.getElementById('chosenText');
  text.innerHTML = `<b>${selected.day}日（${selected.weekday}）${selected.time}</b> を選択中`;
  bar.classList.add('show');
}

document.getElementById('confirmBtn').addEventListener('click', async ()=>{
  if(!selected) return;

  if(modifyBookingId){
    // ===== 予約変更モード：その場でAPIを呼んで確定する =====
    if(!liffUserId){
      alert('LINEアカウントの確認ができませんでした。LINEアプリ内でお試しください。');
      return;
    }
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    btn.textContent = '変更しています…';
    try{
      const res = await fetch(`${API_BASE}/api/booking/reschedule`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          user_id: liffUserId,
          booking_id: parseInt(modifyBookingId, 10),
          booking_date: selected.date,
          booking_time: selected.time
        })
      });
      if(!res.ok) throw new Error('failed');
      btn.textContent = '変更が完了しました';
      if(window.liff && liff.isInClient && liff.isInClient()){
        setTimeout(()=> liff.closeWindow(), 900);
      }
    }catch(e){
      alert('変更に失敗しました。時間をおいて再度お試しください。');
      btn.disabled = false;
      btn.textContent = 'この日時に変更する';
    }
    return;
  }

  // ===== 新規予約モード：お客様情報フォームへ =====
  const params = new URLSearchParams({
    menu_ids: menuIds || '',
    menu_name: menuName || '',
    date: selected.date,
    time: selected.time,
    day: selected.day,
    weekday: selected.weekday
  });
  window.location.href = `booking-form.html?${params.toString()}`;
});

document.getElementById('jumpDate').min = toDateStr(new Date());
document.getElementById('jumpDate').addEventListener('change', (e)=>{
  if(!e.target.value) return;
  rangeStart = new Date(e.target.value + 'T00:00:00');
  daysLoaded = INITIAL_DAYS;
  selectedDate = e.target.value;
  loadAvailability();
});

(async function init(){
  try{
    if(window.liff){
      await liff.init({ liffId: LIFF_ID });
      if(liff.isLoggedIn()){
        const profile = await liff.getProfile();
        liffUserId = profile.userId;
      }
    }
  }catch(e){ /* LIFF外（通常ブラウザ）での動作テストも許容する */ }
  loadAvailability();
})();
</script>

</body>
</html>
